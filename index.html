<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat Appwrite Web</title>
  
  <!-- FontAwesome Icons & Appwrite Web SDK -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Scroll fix: Page ko Screen size tak fit rakha hy */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile devices */
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    /* Auth Screen */
    .auth-container {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      background: #fff;
    }
    .auth-title {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
      color: #1e88e5;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #1e88e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .auth-toggle {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #666;
    }
    .auth-toggle span {
      color: #1e88e5;
      cursor: pointer;
      font-weight: bold;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      background: #fff;
      flex-shrink: 0;
    }
    .top-bar .icon-btn {
      font-size: 18px;
      color: #555;
      cursor: pointer;
    }
    .top-bar .title-text {
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }

    /* Screen Container */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      background: #f7f9fa;
    }
    .screen.active {
      display: flex;
    }

    /* Search Bar & Subtabs (People Screen) */
    .search-bar {
      padding: 10px 15px;
      background: #fff;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: #f0f2f5;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .sub-tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #eee;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .sub-tab {
      padding: 10px 12px;
      font-size: 11px;
      font-weight: bold;
      color: #666;
      white-space: nowrap;
      cursor: pointer;
    }
    .sub-tab.active {
      color: #1e88e5;
      border-bottom: 2px solid #1e88e5;
    }

    /* List Item Styles */
    .item-list {
      background: #fff;
      flex: 1;
      overflow-y: auto;
    }
    .list-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ab47bc;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .item-details {
      flex: 1;
      overflow: hidden;
    }
    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-sub {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Chat View */
    .chat-view {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    .chat-header {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }
    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-title-main {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message-bubble {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      background: #fff;
      align-self: flex-start;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .message-bubble.mine {
      align-self: flex-end;
      background: #e3f2fd;
    }
    .chat-footer {
      background: #fff;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      background: #f0f2f5;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      display: flex;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      height: 55px;
      flex-shrink: 0;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #757575;
      font-size: 10px;
      cursor: pointer;
      position: relative;
    }
    .nav-item i {
      font-size: 16px;
      margin-bottom: 3px;
    }
    .nav-item.active {
      color: #1e88e5;
    }
  </style>
</head>
<body>

<div id="app">
  
  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-title" id="auth-title-text">Login to Chat</div>
    <div class="input-group" id="name-group" style="display: none;">
      <input type="text" id="auth-name" placeholder="Full Name">
    </div>
    <div class="input-group">
      <input type="email" id="auth-email" placeholder="Email Address">
    </div>
    <div class="input-group">
      <input type="password" id="auth-password" placeholder="Password">
    </div>
    <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Login</button>
    <div class="auth-toggle">
      <span id="auth-toggle-text" onclick="toggleAuthMode()">Don't have an account? Sign Up</span>
    </div>
  </div>

  <!-- MESSAGES SCREEN -->
  <div id="screen-messages" class="screen">
    <div class="top-bar">
      <i class="fa-solid fa-bars icon-btn"></i>
      <span class="title-text">Messages</span>
      <i class="fa-solid fa-magnifying-glass icon-btn"></i>
    </div>

    <div class="item-list">
      <div class="list-item" onclick="openChat('Chill & Chat')">
        <div class="avatar" style="background: #80deea;">☕</div>
        <div class="item-details">
          <div class="item-title">Chill & Chat</div>
          <div class="item-sub">Mahi: Wassup!</div>
        </div>
      </div>
      <div class="list-item" onclick="openChat('Silent Star ✨')">
        <div class="avatar" style="background: #a1887f;">SIL</div>
        <div class="item-details">
          <div class="item-title">Silent Star ✨</div>
          <div class="item-sub">Hey there!</div>
        </div>
      </div>
      <div class="list-item" onclick="openChat('Emsha 💕')">
        <div class="avatar" style="background: #f48fb1;">EMS</div>
        <div class="item-details">
          <div class="item-title">Emsha 💕</div>
          <div class="item-sub">Active now</div>
        </div>
      </div>
    </div>
  </div>

  <!-- PEOPLE SCREEN -->
  <div id="screen-people" class="screen">
    <div class="search-bar">
      <input type="text" class="search-input" placeholder="Search people">
    </div>
    <div class="sub-tabs">
      <div class="sub-tab active">YOUR FRIENDS</div>
      <div class="sub-tab">FRIEND REQUESTS</div>
      <div class="sub-tab">BLOCKED PEOPLE</div>
      <div class="sub-tab">ADD FRIEND</div>
    </div>
    <div class="item-list">
      <div class="list-item">
        <div class="avatar" style="background: #7e57c2;">K</div>
        <div class="item-details">
          <div class="item-title">Katberry</div>
        </div>
        <i class="fa-regular fa-comment-dots" style="color: #ccc;"></i>
      </div>
      <div class="list-item">
        <div class="avatar" style="background: #ef5350;">C</div>
        <div class="item-details">
          <div class="item-title">coolobserver</div>
        </div>
        <i class="fa-regular fa-comment-dots" style="color: #ccc;"></i>
      </div>
      <div class="list-item">
        <div class="avatar" style="background: #ef5350;">K</div>
        <div class="item-details">
          <div class="item-title">krishnaa_2</div>
        </div>
        <i class="fa-regular fa-comment-dots" style="color: #ccc;"></i>
      </div>
    </div>
  </div>

  <!-- CHAT ROOM SCREEN -->
  <div id="screen-chat-room" class="chat-view">
    <div class="chat-header">
      <div class="chat-header-left">
        <i class="fa-solid fa-chevron-left" style="color: #1e88e5; cursor: pointer; font-size: 18px;" onclick="closeChat()"></i>
        <div class="chat-title-main" id="chat-title-text">Chat</div>
      </div>
      <div style="display: flex; gap: 12px; color: #555;">
        <i class="fa-solid fa-phone"></i>
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>
    </div>

    <div class="chat-body" id="chat-body">
      <div class="message-bubble">Hello! Welcome to the chat.</div>
    </div>

    <div class="chat-footer">
      <i class="fa-regular fa-face-smile" style="font-size: 20px; color: #777;"></i>
      <input type="text" id="chat-message-input" class="chat-input" placeholder="Type a message...">
      <i class="fa-solid fa-paper-plane" style="font-size: 18px; color: #1e88e5; cursor: pointer;" onclick="sendMessage()"></i>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="bottom-nav" id="main-nav" style="display: none;">
    <div class="nav-item active" id="nav-messages" onclick="switchNav('messages')">
      <i class="fa-solid fa-comment-dots"></i>
      <span>MESSAGES</span>
    </div>
    <div class="nav-item" id="nav-people" onclick="switchNav('people')">
      <i class="fa-solid fa-user-group"></i>
      <span>PEOPLE</span>
    </div>
  </div>

</div>

<script>
  // APPWRITE CONFIGURATION
  const { Client, Account, Databases } = Appwrite;
  const client = new Client();
  
  client
    .setEndpoint('https://fra.cloud.appwrite.io/v1')
    .setProject('6a73ef7f00277f072819');

  const account = new Account(client);
  const databases = new Databases(client);
  const DATABASE_ID = '6a752f030033078f80bb';

  let isSignUp = false;

  async function initAuth() {
    try {
      const user = await account.get();
      if (user) {
        showAppMainView();
      }
    } catch (e) {
      showAuthView();
    }
  }

  function toggleAuthMode() {
    isSignUp = !isSignUp;
    document.getElementById('auth-title-text').innerText = isSignUp ? 'Create Account' : 'Login to Chat';
    document.getElementById('name-group').style.display = isSignUp ? 'block' : 'none';
    document.getElementById('auth-btn').innerText = isSignUp ? 'Sign Up' : 'Login';
    document.getElementById('auth-toggle-text').innerText = isSignUp ? 'Already have an account? Login' : "Don't have an account? Sign Up";
  }

  async function handleAuth() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const name = document.getElementById('auth-name').value;

    if (!email || !password) return alert('Please fill in all fields');

    try {
      if (isSignUp) {
        await account.create('unique()', email, password, name);
        await account.createEmailPasswordSession(email, password);
      } else {
        await account.createEmailPasswordSession(email, password);
      }
      showAppMainView();
    } catch (err) {
      alert(err.message || 'Authentication failed');
    }
  }

  function showAuthView() {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('main-nav').style.display = 'none';
    hideAllScreens();
  }

  function showAppMainView() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-nav').style.display = 'flex';
    switchNav('messages');
  }

  function hideAllScreens() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  }

  function switchNav(type) {
    hideAllScreens();
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

    if (type === 'messages') {
      document.getElementById('screen-messages').classList.add('active');
      document.getElementById('nav-messages').classList.add('active');
    } else if (type === 'people') {
      document.getElementById('screen-people').classList.add('active');
      document.getElementById('nav-people').classList.add('active');
    }
  }

  function openChat(title) {
    document.getElementById('chat-title-text').innerText = title || 'Chat';
    document.getElementById('screen-chat-room').style.display = 'flex';
  }

  function closeChat() {
    document.getElementById('screen-chat-room').style.display = 'none';
  }

  function sendMessage() {
    const input = document.getElementById('chat-message-input');
    const text = input.value.trim();
    if (!text) return;

    const chatBody = document.getElementById('chat-body');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message-bubble mine';
    msgDiv.innerText = text;
    chatBody.appendChild(msgDiv);

    input.value = '';
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  window.onload = initAuth;
</script>
</body>
</html>
