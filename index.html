<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Chat App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Appwrite Web SDK v14 -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>

  <style>
    /* Custom Scrollbar for chat */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }

</head>
<body class="h-full font-sans antialiased flex flex-col justify-center items-center p-2 sm:p-4">

  <!-- Toast Alert System -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform translate-y-[-150%] opacity-0 transition-all duration-300 max-w-sm w-full bg-slate-800 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
    <i id="toast-icon" class="fa-solid fa-circle-info text-indigo-400"></i>
    <span id="toast-message" class="text-sm font-medium">Notification message</span>
  </div>

  <!-- Main Container -->
  <main class="w-full max-w-4xl h-[90vh] bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden relative">

    <!-- Auth View (Login / Signup) -->
    <section id="auth-view" class="w-full h-full flex items-center justify-center p-6">
      <div class="w-full max-w-md space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 text-indigo-500 mb-2 border border-indigo-500/30">
            <i class="fa-solid fa-comments text-2xl"></i>
          </div>
          <h1 class="text-2xl font-bold tracking-tight text-white">Welcome to Pulse</h1>
          <p class="text-sm text-slate-400" id="auth-subtitle">Sign in to your account to continue</p>
        </div>

        <!-- Auth Form -->
        <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
          
          <div id="name-field-wrapper" class="hidden">
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Full Name</label>
            <div class="relative">
              <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500"></i>
              <input type="text" id="auth-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition" placeholder="John Doe" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Email Address</label>
            <div class="relative">
              <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500"></i>
              <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition" placeholder="you@example.com" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500"></i>
              <input type="password" id="auth-password" required minlength="8" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••" />
            </div>
          </div>

          <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl shadow-lg shadow-indigo-600/20 transition duration-200 flex items-center justify-center space-x-2">
            <span>Sign In</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </form>

        <!-- Toggle Login/Signup -->
        <div class="text-center text-sm text-slate-400">
          <span id="auth-toggle-text">Don't have an account?</span>
          <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-indigo-400 font-semibold hover:underline ml-1">Sign Up</button>
        </div>

      </div>
    </section>

    <!-- Chat View -->
    <section id="chat-view" class="w-full h-full flex flex-col hidden">
      
      <!-- Top Navigation Bar -->
      <header class="px-6 py-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="relative">
            <div id="user-avatar" class="w-10 h-10 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center uppercase">
              U
            </div>
            <span class="bottom-0 right-0 absolute w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
          </div>
          <div>
            <h2 id="user-display-name" class="text-sm font-semibold text-white">User Name</h2>
            <p id="user-email" class="text-xs text-slate-400">user@example.com</p>
          </div>
        </div>

        <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-400 p-2 rounded-xl border border-slate-800 hover:border-rose-500/30 hover:bg-rose-500/10 transition">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </header>

      <!-- Messages Window -->
      <main id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4">
        <div class="text-center text-xs text-slate-500 my-4">
          <span>Beginning of chat history</span>
        </div>
      </main>

      <!-- Message Input Bar -->
      <footer class="p-4 border-t border-slate-800 bg-slate-900/50">
        <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center space-x-2">
          <input 
            type="text" 
            id="chat-input" 
            placeholder="Type a message..." 
            required 
            autocomplete="off" 
            class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
          />
          <button 
            type="submit" 
            class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center justify-center"
          >
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </footer>

    </section>

  </main>

  <noscript><a href="https://www.text.com/chat-with-ai-agent/31568e37-abef-4524-9de9-b3a802d9a581/" rel="nofollow">Chat with AI Agent</a>, powered by <a href="https://www.text.com/" rel="noopener nofollow" target="_blank">Text</a></noscript>

  <!-- App Application Script -->
  <script>
    // Config Setup
    const APPWRITE_ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
    const APPWRITE_PROJECT_ID = '6a73ef7f00277f072819';
    const DATABASE_ID = '6a752f030033078f80bb';
    const COLLECTION_ID = 'messages';

    // Initialize Appwrite SDK
    const { Client, Account, Databases, ID, Query } = Appwrite;
    const client = new Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT_ID);
    const account = new Account(client);
    const databases = new Databases(client);

    // Global State
    let currentUser = null;
    let isSignUpMode = false;
    let realtimeUnsubscribe = null;

    // Element References
    const authView = document.getElementById('auth-view');
    const chatView = document.getElementById('chat-view');
    const nameFieldWrapper = document.getElementById('name-field-wrapper');
    const authSubtitle = document.getElementById('auth-subtitle');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const authToggleText = document.getElementById('auth-toggle-text');
    const authToggleBtn = document.getElementById('auth-toggle-btn');
    const chatMessages = document.getElementById('chat-messages');

    // Toast Function
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      toastMessage.innerText = message;
      if (type === 'error') {
        toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400';
      } else {
        toastIcon.className = 'fa-solid fa-circle-info text-indigo-400';
      }

      toast.classList.remove('translate-y-[-150%]', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-[-150%]', 'opacity-0');
      }, 3500);
    }

    // Initialize App
    async function init() {
      try {
        currentUser = await account.get();
        showChatView();
      } catch (err) {
        showAuthView();
      }
    }

    // Toggle Auth Mode (Sign In vs Sign Up)
    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      if (isSignUpMode) {
        nameFieldWrapper.classList.remove('hidden');
        authSubtitle.innerText = 'Create a new account to get started';
        authSubmitBtn.querySelector('span').innerText = 'Sign Up';
        authToggleText.innerText = 'Already have an account?';
        authToggleBtn.innerText = 'Sign In';
      } else {
        nameFieldWrapper.classList.add('hidden');
        authSubtitle.innerText = 'Sign in to your account to continue';
        authSubmitBtn.querySelector('span').innerText = 'Sign In';
        authToggleText.innerText = "Don't have an account?";
        authToggleBtn.innerText = 'Sign Up';
      }
    }

    // Handle Auth Submission
    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value.trim();

      try {
        if (isSignUpMode) {
          if (!name) return showToast('Please enter your full name', 'error');
          await account.create(ID.unique(), email, password, name);
          showToast('Account created successfully! Signing in...');
        }
        await account.createEmailPasswordSession(email, password);
        currentUser = await account.get();
        showChatView();
      } catch (err) {
        showToast(err.message || 'Authentication failed', 'error');
      }
    }

    // Handle Logout
    async function handleLogout() {
      try {
        if (realtimeUnsubscribe) realtimeUnsubscribe();
        await account.deleteSession('current');
        currentUser = null;
        showAuthView();
        showToast('Logged out successfully');
      } catch (err) {
        showToast(err.message || 'Logout failed', 'error');
      }
    }

    // Views Switchers
    function showAuthView() {
      chatView.classList.add('hidden');
      authView.classList.remove('hidden');
    }

    async function showChatView() {
      authView.classList.add('hidden');
      chatView.classList.remove('hidden');

      // Populate User Header Info
      document.getElementById('user-display-name').innerText = currentUser.name || 'Anonymous User';
      document.getElementById('user-email').innerText = currentUser.email;
      document.getElementById('user-avatar').innerText = (currentUser.name || currentUser.email).charAt(0).toUpperCase();

      // Load Messages & Subscribe to Realtime
      await loadMessages();
      subscribeToRealtime();
    }

    // Fetch Initial Message History
    async function loadMessages() {
      chatMessages.innerHTML = `
        <div class="text-center text-xs text-slate-500 my-4">
          <span>Loading messages...</span>
        </div>
      `;

      try {
        const response = await databases.listDocuments(
          DATABASE_ID,
          COLLECTION_ID,
          [Query.orderAsc('$createdAt'), Query.limit(100)]
        );

        chatMessages.innerHTML = '';
        response.documents.forEach(doc => renderMessage(doc));
        scrollToBottom();
      } catch (err) {
        showToast('Failed to load messages. Please ensure Collection setup is completed.', 'error');
      }
    }

    // Send New Message
    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content) return;

      input.value = '';

      try {
        await databases.createDocument(
          DATABASE_ID,
          COLLECTION_ID,
          ID.unique(),
          {
            sender_id: currentUser.$id,
            sender_name: currentUser.name || currentUser.email,
            content: content
          }
        );
      } catch (err) {
        showToast('Failed to send message: ' + err.message, 'error');
      }
    }

    // Render Message Component
    function renderMessage(doc) {
      const isMe = doc.sender_id === currentUser.$id;
      const messageWrapper = document.createElement('div');
      messageWrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1 mb-3`;

      const formattedTime = new Date(doc.$createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      messageWrapper.innerHTML = `
        <span class="text-[10px] text-slate-500 px-1">${isMe ? 'You' : doc.sender_name} • ${formattedTime}</span>
        <div class="max-w-[75%] px-4 py-2.5 rounded-2xl text-sm break-words shadow-sm ${
          isMe 
            ? 'bg-indigo-600 text-white rounded-br-none' 
            : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
        }">
          ${escapeHTML(doc.content)}
        </div>
      `;

      chatMessages.appendChild(messageWrapper);
      scrollToBottom();
    }

    // Appwrite Realtime Channel Subscription
    function subscribeToRealtime() {
      const channel = `databases.${DATABASE_ID}.collections.${COLLECTION_ID}.documents`;
      
      realtimeUnsubscribe = client.subscribe(channel, response => {
        if (response.events.includes("databases.*.collections.*.documents.*.create")) {
          renderMessage(response.payload);
        }
      });
    }

    // Helper Utilities
    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Kickstart application on load
    init();
  </script>
</body>
</html>
