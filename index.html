<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseChat - Realtime Appwrite Chat</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Appwrite Web SDK v14 -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.8);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between overflow-x-hidden">

  <!-- Toast Notification System -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- AUTH VIEW -->
  <div id="auth-view" class="flex-1 flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl space-y-6">
      
      <!-- Brand Logo Header -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-600 text-white shadow-lg shadow-brand-500/30 mb-2">
          <i data-lucide="message-square-code" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">Welcome to PulseChat</h1>
        <p class="text-slate-400 text-sm">Real-time collaboration powered by Appwrite</p>
      </div>

      <!-- Auth Mode Switcher -->
      <div class="flex p-1 bg-slate-900/80 rounded-xl border border-slate-800">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-medium rounded-lg bg-brand-600 text-white transition-all duration-200">Login</button>
        <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all duration-200">Sign Up</button>
      </div>

      <!-- Auth Form -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div id="name-field-group" class="hidden">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
          <div class="relative">
            <i data-lucide="user" class="absolute left-3 top-3 w-5 h-5 text-slate-500"></i>
            <input type="text" id="auth-name" placeholder="John Doe" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-brand-500 transition" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3 top-3 w-5 h-5 text-slate-500"></i>
            <input type="email" id="auth-email" required placeholder="name@example.com" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-brand-500 transition" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-slate-500"></i>
            <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-brand-500 transition" />
          </div>
        </div>

        <button type="submit" id="auth-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2">
          <span>Login to Account</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

    </div>
  </div>

  <!-- CHAT VIEW -->
  <div id="chat-view" class="hidden flex-1 flex flex-col h-screen max-w-6xl w-full mx-auto p-2 sm:p-4">
    <div class="glass-card flex-1 rounded-2xl flex flex-col overflow-hidden border border-slate-800">
      
      <!-- Top Navigation / User Header -->
      <div class="px-6 py-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="relative">
            <div id="user-avatar" class="w-10 h-10 rounded-full bg-brand-600 flex items-center justify-center font-bold text-white shadow-inner">
              U
            </div>
            <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
          </div>
          <div>
            <h2 id="user-display-name" class="font-semibold text-sm leading-tight">Loading...</h2>
            <p id="user-display-email" class="text-xs text-slate-400"></p>
          </div>
        </div>

        <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-400 p-2 rounded-lg hover:bg-slate-800/80 transition" title="Logout">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Messages Stream -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4">
        <div id="loading-spinner" class="flex items-center justify-center h-full text-slate-500 gap-2">
          <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-brand-500"></i>
          <span>Syncing conversations...</span>
        </div>
      </div>

      <!-- Message Composer Box -->
      <div class="p-4 bg-slate-900/90 border-t border-slate-800">
        <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
          <input 
            type="text" 
            id="message-input" 
            required 
            placeholder="Type a message..." 
            autocomplete="off"
            class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500 transition text-slate-100 placeholder-slate-500"
          />
          <button 
            type="submit" 
            id="send-btn"
            class="bg-brand-600 hover:bg-brand-700 text-white p-3 rounded-xl transition shadow-lg shadow-brand-600/30 disabled:opacity-50"
          >
            <i data-lucide="send" class="w-5 h-5"></i>
          </button>
        </form>
      </div>

    </div>
  </div>

  <!-- APPLICATION SCRIPT -->
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Appwrite Configuration Parameters
    const ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
    const PROJECT_ID = '6a73ef7f00277f072819';
    const DATABASE_ID = '6a752f030033078f80bb';
    const COLLECTION_ID = 'messages'; // Ensure this collection exists in Appwrite

    // Appwrite SDK Setup
    const { Client, Account, Databases, ID, Query } = Appwrite;
    const client = new Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID);
    const account = new Account(client);
    const databases = new Databases(client);

    // Global State
    let currentUser = null;
    let authMode = 'login'; // 'login' or 'signup'
    let unsubscribeRealtime = null;

    // DOM Elements
    const authView = document.getElementById('auth-view');
    const chatView = document.getElementById('chat-view');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');

    // Startup Execution
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        currentUser = await account.get();
        showChatView();
      } catch (err) {
        showAuthView();
      }
    });

    // UI Tab Navigation Controls
    function switchAuthTab(mode) {
      authMode = mode;
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const nameGroup = document.getElementById('name-field-group');
      const submitBtnSpan = document.querySelector('#auth-btn span');

      if (mode === 'login') {
        tabLogin.className = 'flex-1 py-2 text-sm font-medium rounded-lg bg-brand-600 text-white transition-all duration-200';
        tabSignup.className = 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all duration-200';
        nameGroup.classList.add('hidden');
        submitBtnSpan.innerText = 'Login to Account';
      } else {
        tabSignup.className = 'flex-1 py-2 text-sm font-medium rounded-lg bg-brand-600 text-white transition-all duration-200';
        tabLogin.className = 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition-all duration-200';
        nameGroup.classList.remove('hidden');
        submitBtnSpan.innerText = 'Create Account';
      }
    }

    // Submit Handler: Auth
    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value;
      const authBtn = document.getElementById('auth-btn');

      authBtn.disabled = true;
      authBtn.classList.add('opacity-70');

      try {
        if (authMode === 'signup') {
          await account.create(ID.unique(), email, password, name);
          showToast('Account created successfully! Logging you in...', 'success');
        }
        
        await account.createEmailPasswordSession(email, password);
        currentUser = await account.get();
        showToast('Successfully authenticated!', 'success');
        showChatView();
      } catch (error) {
        showToast(error.message || 'Authentication failed', 'error');
      } finally {
        authBtn.disabled = false;
        authBtn.classList.remove('opacity-70');
      }
    }

    // Submit Handler: Logout
    async function handleLogout() {
      try {
        if (unsubscribeRealtime) unsubscribeRealtime();
        await account.deleteSession('current');
        currentUser = null;
        showToast('Logged out safely', 'success');
        showAuthView();
      } catch (error) {
        showToast('Logout failed', 'error');
      }
    }

    // Switch View to Auth
    function showAuthView() {
      authView.classList.remove('hidden');
      chatView.classList.add('hidden');
    }

    // Switch View to Chat
    function showChatView() {
      authView.classList.add('hidden');
      chatView.classList.remove('hidden');

      // Set user header details
      const userDisplayName = document.getElementById('user-display-name');
      const userDisplayEmail = document.getElementById('user-display-email');
      const userAvatar = document.getElementById('user-avatar');

      userDisplayName.innerText = currentUser.name || 'Anonymous User';
      userDisplayEmail.innerText = currentUser.email;
      userAvatar.innerText = (currentUser.name || currentUser.email).charAt(0).toUpperCase();

      loadInitialMessages();
      subscribeToRealtimeChat();
    }

    // Fetch existing messages
    async function loadInitialMessages() {
      try {
        const response = await databases.listDocuments(
          DATABASE_ID,
          COLLECTION_ID,
          [Query.orderAsc('$createdAt'), Query.limit(100)]
        );

        messagesContainer.innerHTML = '';
        
        if (response.documents.length === 0) {
          messagesContainer.innerHTML = `
            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-500 gap-2">
              <i data-lucide="message-square font-light" class="w-12 h-12 stroke-1"></i>
              <p class="text-sm">No messages yet. Start the conversation!</p>
            </div>`;
          lucide.createIcons();
        } else {
          response.documents.forEach(doc => renderMessageBubble(doc));
          scrollToBottom();
        }
      } catch (error) {
        showToast('Error loading messages: ' + error.message, 'error');
      }
    }

    // Send Message
    async function handleSendMessage(e) {
      e.preventDefault();
      const body = messageInput.value.trim();
      if (!body) return;

      messageInput.value = '';

      try {
        await databases.createDocument(
          DATABASE_ID,
          COLLECTION_ID,
          ID.unique(),
          {
            userId: currentUser.$id,
            username: currentUser.name || currentUser.email.split('@')[0],
            body: body
          }
        );
      } catch (error) {
        showToast('Failed to send message: ' + error.message, 'error');
      }
    }

    // Subscribe to Appwrite Realtime stream
    function subscribeToRealtimeChat() {
      const channel = `databases.${DATABASE_ID}.collections.${COLLECTION_ID}.documents`;

      unsubscribeRealtime = client.subscribe(channel, response => {
        if (response.events.includes(`${channel}.*.create`)) {
          const emptyState = document.getElementById('empty-state');
          if (emptyState) emptyState.remove();

          renderMessageBubble(response.payload);
          scrollToBottom();
        }
      });
    }

    // Render single bubble element
    function renderMessageBubble(doc) {
      const isSelf = doc.userId === currentUser.$id;
      const messageWrapper = document.createElement('div');
      messageWrapper.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'} space-y-1`;

      const formattedTime = new Date(doc.$createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      messageWrapper.innerHTML = `
        <span class="text-[10px] text-slate-400 px-1 font-medium">${isSelf ? 'You' : doc.username} • ${formattedTime}</span>
        <div class="max-w-xs sm:max-w-md px-4 py-2.5 rounded-2xl text-sm leading-relaxed ${
          isSelf 
            ? 'bg-brand-600 text-white rounded-br-none shadow-md shadow-brand-600/20' 
            : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
        }">
          ${escapeHTML(doc.body)}
        </div>
      `;

      messagesContainer.appendChild(messageWrapper);
    }

    // Utilities
    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Toast Alert Engine
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-rose-600' : type === 'success' ? 'bg-emerald-600' : 'bg-brand-600';

      toast.className = `pointer-events-auto flex items-center gap-3 ${bgColor} text-white px-4 py-3 rounded-xl shadow-xl text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0`;
      toast.innerHTML = `
        <i data-lucide="${type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info'}" class="w-4 h-4"></i>
        <span>${message}</span>
      `;

      container.appendChild(toast);
      lucide.createIcons();

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
</body>
</html>
