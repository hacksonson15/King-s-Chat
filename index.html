<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King's Chat</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Appwrite Web SDK -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f5f7;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Auth View Styles */
    .auth-container {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 90%;
    }

    .auth-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2b9bf4;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #2b9bf4;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background-color: #1a82d6;
    }

    .toggle-auth {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .toggle-auth a {
      color: #2b9bf4;
      text-decoration: none;
      font-weight: bold;
    }

    /* Main Dashboard View */
    #dashboard-view {
      display: none;
      flex-direction: column;
      height: 100vh;
      background-color: #f0f2f5;
    }

    /* Top Header */
    .top-header {
      background-color: #ffffff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e0e0e0;
    }

    .menu-btn, .search-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #555;
      cursor: pointer;
    }

    .room-toggle-container {
      display: flex;
      background-color: #e3f2fd;
      border: 1px solid #2b9bf4;
      border-radius: 6px;
      overflow: hidden;
    }

    .toggle-btn {
      padding: 6px 16px;
      border: none;
      background: transparent;
      color: #2b9bf4;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .toggle-btn.active {
      background-color: #2b9bf4;
      color: #ffffff;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .content-box {
      background-color: #e0e0e0;
      height: 45%;
      border-radius: 8px;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      background-color: #ffffff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid #e0e0e0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #757575;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      gap: 4px;
      cursor: pointer;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item.active {
      color: #2b9bf4;
    }
  </style>
</head>
<body>

  <!-- Auth Container (Login / Signup) -->
  <div class="auth-container" id="auth-view">
    <h2 id="auth-title">King's Chat Login</h2>
    <form id="auth-form">
      <div class="form-group" id="name-group" style="display: none;">
        <label>Name</label>
        <input type="text" id="user-name" placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="user-email" placeholder="Enter email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="user-password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn" id="submit-btn">Login</button>
    </form>
    <div class="toggle-auth">
      <span id="toggle-text">Account nahi hai?</span> 
      <a href="#" id="toggle-link" onclick="toggleAuthMode(event)">Sign Up karo</a>
    </div>
  </div>

  <!-- Dashboard View (Pic jesa Layout) -->
  <div id="dashboard-view">
    <!-- Top Header Navigation -->
    <div class="top-header">
      <button class="menu-btn" onclick="logout()"><i class="fa-solid fa-bars"></i></button>
      
      <div class="room-toggle-container">
        <button class="toggle-btn active" onclick="switchRoomTab(this)">All Rooms</button>
        <button class="toggle-btn" onclick="switchRoomTab(this)">My Rooms</button>
      </div>
      
      <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <div class="content-box"></div>
      <div class="content-box"></div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-item">
        <i class="fa-solid fa-fire"></i>
        <span>MEMES</span>
      </div>
      <div class="nav-item active">
        <i class="fa-solid fa-house"></i>
        <span>ROOMS</span>
      </div>
      <div class="nav-item">
        <i class="fa-solid fa-comment-dots"></i>
        <span>MESSAGES</span>
      </div>
      <div class="nav-item">
        <i class="fa-solid fa-user-group"></i>
        <span>PEOPLE</span>
      </div>
      <div class="nav-item">
        <i class="fa-solid fa-border-all"></i>
        <span>APPS</span>
      </div>
    </div>
  </div>

  <script>
    // --- Appwrite Configuration ---
    const { Client, Account, ID } = Appwrite;
    const client = new Client();

    client
      .setEndpoint('https://fra.cloud.appwrite.io/v1')
      .setProject('6a73ef7f00277f072819');

    const account = new Account(client);

    let isSignUp = false;

    // Check logged in user on page load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await account.get();
        if(user) {
          showDashboard();
        }
      } catch (err) {
        showAuth();
      }
    });

    // Form Submit Handler (Login / Signup)
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('user-email').value;
      const password = document.getElementById('user-password').value;

      try {
        if (isSignUp) {
          const name = document.getElementById('user-name').value;
          await account.create(ID.unique(), email, password, name);
          await account.createEmailPasswordSession(email, password);
        } else {
          await account.createEmailPasswordSession(email, password);
        }
        showDashboard();
      } catch (error) {
        alert(error.message);
      }
    });

    // Switch between Login and Signup forms
    function toggleAuthMode(e) {
      e.preventDefault();
      isSignUp = !isSignUp;
      
      const title = document.getElementById('auth-title');
      const submitBtn = document.getElementById('submit-btn');
      const nameGroup = document.getElementById('name-group');
      const toggleText = document.getElementById('toggle-text');
      const toggleLink = document.getElementById('toggle-link');

      if (isSignUp) {
        title.innerText = "King's Chat Sign Up";
        submitBtn.innerText = "Sign Up";
        nameGroup.style.display = "block";
        toggleText.innerText = "Pehle se account hai?";
        toggleLink.innerText = "Login karo";
      } else {
        title.innerText = "King's Chat Login";
        submitBtn.innerText = "Login";
        nameGroup.style.display = "none";
        toggleText.innerText = "Account nahi hai?";
        toggleLink.innerText = "Sign Up karo";
      }
    }

    // Navigation & Views Display
    function showDashboard() {
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'flex';
    }

    function showAuth() {
      document.getElementById('auth-view').style.display = 'block';
      document.getElementById('dashboard-view').style.display = 'none';
    }

    async function logout() {
      try {
        await account.deleteSession('current');
        showAuth();
      } catch (error) {
        alert("Logout failed: " + error.message);
      }
    }

    function switchRoomTab(element) {
      document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
